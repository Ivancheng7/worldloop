[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "worldloop"
version = "0.1.0"
description = "Closed-loop, simulator-grounded benchmark for interactive world models"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
  "torch>=2.4",
  "torchvision>=0.19",
  "timm>=1.0",
  "scikit-image>=0.23",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
  "lpips>=0.1.4",
]

[project.optional-dependencies]
models = ["diffusers>=0.32", "transformers>=4.45", "accelerate>=1.0", "huggingface_hub>=0.26"]

[project.scripts]
worldloop = "worldloop.cli:main"

[tool.setuptools.packages.find]
include = ["worldloop*"]
